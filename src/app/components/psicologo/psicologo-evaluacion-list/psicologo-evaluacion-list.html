<div class="evaluacion-container">
  <div class="header-section">
    <h2>Mis Evaluaciones</h2>
    <p class="subtitle">Reseñas y comentarios de los padres</p>
  </div>

  <mat-card class="evaluacion-card">
    <mat-card-content>
      <div *ngIf="evaluaciones.length === 0" class="empty-state">
        <mat-icon>rate_review</mat-icon>
        <p>Aún no tienes evaluaciones registradas.</p>
      </div>

      <table mat-table [dataSource]="evaluaciones" *ngIf="evaluaciones.length > 0" class="nk-table w-full">

        <!-- Fecha Column -->
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef> Fecha </th>
          <td mat-cell *matCellDef="let element"> {{element.fecha | date:'dd/MM/yyyy'}} </td>
        </ng-container>

        <!-- Padre Column (Labeled as Familia/Evaluador) -->
        <ng-container matColumnDef="padre">
          <th mat-header-cell *matHeaderCellDef> Evaluador (Padre/Tutor) </th>
          <td mat-cell *matCellDef="let element"> {{element.nombrePadre}} </td>
        </ng-container>

        <!-- Puntaje Column -->
        <ng-container matColumnDef="puntaje">
          <th mat-header-cell *matHeaderCellDef> Calificación </th>
          <td mat-cell *matCellDef="let element">
            <div class="stars-container">
              <mat-icon *ngFor="let star of getStarsArray(element.puntaje)" class="star-icon">star</mat-icon>
            </div>
          </td>
        </ng-container>

        <!-- Comentario Column -->
        <ng-container matColumnDef="comentario">
          <th mat-header-cell *matHeaderCellDef> Comentario </th>
          <td mat-cell *matCellDef="let element" class="comment-cell">
            {{element.comentario || 'Sin comentario'}}
          </td>
        </ng-container>

        <!-- Acciones Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="verDetalle(element)" matTooltip="Ver Detalle Completo">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
